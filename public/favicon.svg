<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded brand container -->
  <rect width="64" height="64" rx="16" fill="#1D1A39" />
  
  <!-- Subtle blush background highlight -->
  <circle cx="48" cy="16" r="14" fill="#F39F5A" opacity="0.18" />
  
  <!-- Lowercase 'k' stem with node at base and top -->
  <line x1="20" y1="14" x2="20" y2="50" stroke="#FFFDFC" stroke-width="5" stroke-linecap="round" />
  <circle cx="20" cy="14" r="3.5" fill="#E8BCB9" />
  <circle cx="20" cy="50" r="3.5" fill="#E8BCB9" />

  <!-- Midpoint attempt vertex -->
  <circle cx="20" cy="33" r="3" fill="#FFFDFC" />

  <!-- Upward branch to k-th attempt (mastery node) -->
  <line x1="20" y1="33" x2="42" y2="18" stroke="#F39F5A" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Downward branch (previous attempt / baseline) -->
  <line x1="20" y1="33" x2="40" y2="48" stroke="#AE445A" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Attempt nodes -->
  <circle cx="40" cy="48" r="4.5" fill="#AE445A" stroke="#1D1A39" stroke-width="1.5" />
  <!-- The k-th victorious node (Sunset orange) -->
  <circle cx="42" cy="18" r="6" fill="#F39F5A" stroke="#FFFDFC" stroke-width="2" />
  <circle cx="42" cy="18" r="2.5" fill="#1D1A39" />
</svg>