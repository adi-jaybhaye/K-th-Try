<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rounded brand container -->
  <rect width="128" height="128" rx="32" fill="#1D1A39" />
  
  <!-- Subtle blush background highlight -->
  <circle cx="96" cy="32" r="28" fill="#F39F5A" opacity="0.18" />
  
  <!-- Lowercase 'k' stem with node at base and top -->
  <line x1="40" y1="28" x2="40" y2="100" stroke="#FFFDFC" stroke-width="10" stroke-linecap="round" />
  <circle cx="40" cy="28" r="7" fill="#E8BCB9" />
  <circle cx="40" cy="100" r="7" fill="#E8BCB9" />

  <!-- Midpoint attempt vertex -->
  <circle cx="40" cy="66" r="6" fill="#FFFDFC" />

  <!-- Upward branch to k-th attempt (mastery node) -->
  <line x1="40" y1="66" x2="84" y2="36" stroke="#F39F5A" stroke-width="9" stroke-linecap="round" />
  
  <!-- Downward branch (previous attempt) -->
  <line x1="40" y1="66" x2="80" y2="96" stroke="#AE445A" stroke-width="9" stroke-linecap="round" />
  
  <!-- Attempt nodes -->
  <circle cx="80" cy="96" r="9" fill="#AE445A" stroke="#1D1A39" stroke-width="3" />
  <!-- The k-th victorious node (Sunset orange) -->
  <circle cx="84" cy="36" r="12" fill="#F39F5A" stroke="#FFFDFC" stroke-width="4" />
  <circle cx="84" cy="36" r="5" fill="#1D1A39" />
</svg>
